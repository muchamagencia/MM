<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Talento - Mucha M </title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/talent.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <h1><a href="index.html" style="color: inherit; text-decoration: none;">Mucha M </a></h1>
                <p class="tagline">Agencia de Talentos</p>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="index.html#actores">Actores</a></li>
                <li><a href="index.html#sobre-nosotros">Sobre Nosotros</a></li>
                <li><a href="index.html#contacto">Contacto</a></li>
            </ul>
        </div>
    </nav>

    <!-- WhatsApp Floating Button -->
    <a href="https://wa.me/34650014048" class="whatsapp-btn" target="_blank" title="Contáctanos por WhatsApp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <!-- Talent Profile Section -->
    <section class="talent-profile">
        <div class="container">
            <div class="profile-grid">
                <div class="profile-image">
                    <div class="image-placeholder">
                        <i class="fas fa-user-circle"></i>
                    </div>
                </div>
                <div class="profile-info">
                    <div id="talentName" class="profile-name"></div>
                    <div id="talentCategory" class="profile-category"></div>
                    <div class="profile-details">
                        <div class="detail-item">
                            <strong>Edad:</strong> <span id="talentAge"></span> años
                        </div>
                        <div class="detail-item">
                            <strong>Sexo:</strong> <span id="talentGender"></span>
                        </div>
                        <div class="detail-item">
                            <strong>Procedencia:</strong> <span id="talentOrigin"></span>
                        </div>
                    </div>
                    <div class="profile-description">
                        <h3>Descripción</h3>
                        <p id="talentDescription"></p>
                    </div>
                    <div class="profile-skills">
                        <h3>Habilidades</h3>
                        <div id="talentSkills" class="skills-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Contact Form Section -->
    <section class="talent-contact">
        <div class="container">
            <h2>Contactar con <span id="talentFormName"></span></h2>
            <form class="talent-form" id="talentForm">
                <input type="text" placeholder="Tu Nombre" required>
                <input type="email" placeholder="Tu Email" required>
                <input type="tel" placeholder="Tu Teléfono" required>
                <select required>
                    <option value="">Tipo de Oportunidad</option>
                    <option value="cine">Cine</option>
                    <option value="television">Televisión</option>
                    <option value="publicidad">Publicidad</option>
                    <option value="teatro">Teatro</option>
                    <option value="otro">Otro</option>
                </select>
                <textarea placeholder="Detalles de la Oportunidad" rows="5" required></textarea>
                <button type="submit" class="btn btn-primary">Enviar Solicitud</button>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Mucha M - Agencia de Talentos. Todos los derechos reservados.</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/talent.js"></script>
</body>
</html>
